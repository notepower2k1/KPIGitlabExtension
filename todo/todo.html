<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitLab Productivity - Kanban Board</title>
    <link rel="stylesheet" href="todo.css" />
    <script src="../i18n.js"></script>
</head>

<body>
    <div class="main-wrapper">
        <header class="page-header">
            <div class="header-left">
                <h1 data-i18n="kanbanTitle">📋 Kanban Board</h1>
                <p id="total-todo-count">0 công việc đang thực hiện</p>
            </div>
            <div class="header-right">
                <button id="modeSwitchBtn" class="btn-secondary" data-i18n="windowModeBtn" data-i18n-title="modeSwitchTooltip" title="Chuyển đổi chế độ cửa sổ">🗗 Cửa sổ rời</button>
                <button id="clear-btn" class="btn-danger-outline" data-i18n="clearAllBtn">Xóa tất cả</button>
            </div>
        </header>

        <!-- Composer Area -->
        <div class="todo-composer">
            <div class="composer-card">
                <div class="input-row">
                    <input type="text" id="todo-input" data-i18n-placeholder="addTaskPlaceholder" placeholder="Việc cần làm là gì? (Nhấn Enter để thêm)" />
                    <input type="datetime-local" id="deadline-input" data-i18n-placeholder="deadlinePlaceholder" data-i18n-title="deadlinePlaceholder" title="Hạn chót" />
                </div>

                <button id="add-btn" class="btn-primary full-width" data-i18n="addTaskBtn">➕ Thêm công việc</button>
            </div>
        </div>

        <!-- Kanban Board Area -->
        <main class="kanban-board">
            <!-- TODO Column -->
            <div class="kanban-column" id="col-todo">
                <div class="column-header">
                    <span class="dot todo-dot"></span>
                    <h3 data-i18n="colTodo">CẦN LÀM</h3>
                    <span class="count-badge" id="count-todo">0</span>
                </div>
                <div class="task-list" id="list-todo"></div>
            </div>

            <!-- PROCESSING Column -->
            <div class="kanban-column" id="col-processing">
                <div class="column-header">
                    <span class="dot processing-dot"></span>
                    <h3 data-i18n="colProcessing">ĐANG LÀM</h3>
                    <span class="count-badge" id="count-processing">0</span>
                </div>
                <div class="task-list" id="list-processing"></div>
            </div>

            <!-- DONE Column -->
            <div class="kanban-column" id="col-done">
                <div class="column-header">
                    <span class="dot done-dot"></span>
                    <h3 data-i18n="colDone">HOÀN THÀNH</h3>
                    <span class="count-badge" id="count-done">0</span>
                </div>
                <div class="task-list" id="list-done"></div>
            </div>
        </main>
    </div>
 
    <!-- Task Edit Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="editTaskModalTitle">Chỉnh sửa công việc</h3>
                <span id="close-edit-btn" class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-task-title" data-i18n="taskTitleLabel">Tên công việc:</label>
                    <input type="text" id="edit-task-title" class="form-control" />
                </div>
                <div class="form-group">
                    <label for="edit-task-deadline" data-i18n="deadlineLabel">Hạn chót:</label>
                    <input type="datetime-local" id="edit-task-deadline" class="form-control" />
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-edit-btn" class="btn-secondary" data-i18n="cancelBtn">Hủy</button>
                <button id="save-edit-btn" class="btn-primary" data-i18n="saveChangesBtn">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <script src="../utils.js"></script>
    <script src="todo.js"></script>
</body>

</html>
